               <img src="jaddu.jpeg" alt="Rajasthan Royals player Jadeja points skyward in celebration after taking a wicket during an IPL match.">
               <figcaption>Ravindra Jadeja marks his comeback in Rajasthan Royals colors after 17 years with a double-wicket blow against Chennai Super Kings and has never been happier to be back.</figcaption>
            </figure>
            <figure>
               <img src="dhoni-batting.jpeg" alt="MS Dhoni batting in the nets during a Chennai Super Kings IPL training session.">
               <figcaption>Dhoni in the nets is a reminder that greatness is never accidental— it's earned, ball by ball.</figcaption>
            </figure>
            <figure>
               <img src="jaddu-bat.jpeg" alt="Rajasthan Royals player Ravindra Jadeja inspects a cricket bat in pink while speaking with a person.">
               <figcaption>The craft behind the chaos. Jadeja takes his tools as seriously as his technique. Every edge, every grain, scrutinised to perfection.</figcaption>
            </figure>
            <figure>
               <img src="gt-clapping.jpeg" alt="Gujarat Titans celebrate a win with high-fives in their navy and gold jerseys.">
               <figcaption>When GT get on a roll, the high-fives come fast and the opposition starts to worry.</figcaption>
            </figure>
            <figure>
               <img src="csk-batting.jpeg" alt="Two CSK batsmen stand together in front of a packed yellow crowd.">
               <figcaption>The CSK openers hold their ground at Chepauk.</figcaption>
            </figure>
            <figure>
               <img src="jaddu-pushpa.jpeg" alt="Rajasthan Royals bowler Ravindra Jadeja makes a mischievous gesture towards a Sunrisers Hyderabad batsman after taking a wicket.">
               <figcaption>Don't bowl at Jadeja and don't bat against him either. The Pushpa celebration gesture says it all— he's not going to bow down to anyone.</figcaption>
            </figure>
            <figure>
               <img src="tilak.jpeg" alt="Mumbai Indians batsman Tilak Varma in blue jersey raises his fist in celebration during an IPL night match.">
               <figcaption>Fist raised, jersey dirty, spirit unbreakable. Tilak Varma is making IPL 2026 his own.</figcaption>
            </figure>
            <figure>
               <img src="rcb-win.jpeg" alt="RCB players in red and black celebrate a wicket together during an IPL night match.">
               <figcaption>Red and black and buzzing with belief. RCB's dressing room energy in 2026 is feeding straight onto the pitch— and it is working.</figcaption>
            </figure>
